# Set TMUXAXXING_ROOT before sourcing this file.
# Example: set-environment -g TMUXAXXING_ROOT /path/to/tmuxaxxing
set-option -g @tmuxaxxing_left on
set-option -g @tmuxaxxing_right on

bind-key a run-shell '"$TMUXAXXING_ROOT/scripts/toggle-sidebar.sh" left'
bind-key g run-shell '"$TMUXAXXING_ROOT/scripts/toggle-sidebar.sh" right'
bind-key R run-shell '"$TMUXAXXING_ROOT/scripts/reload.sh"'
bind-key s run-shell '"$TMUXAXXING_ROOT/scripts/slack-toggle.sh"'

set-hook -g after-new-window 'run-shell -b "\"$TMUXAXXING_ROOT/scripts/ensure-sidebars.sh\" #{window_id}"'
set-hook -g session-created 'run-shell -b "\"$TMUXAXXING_ROOT/scripts/ensure-sidebars.sh\" #{window_id}"'
set-hook -g pane-focus-in 'if-shell -F "#{==:#{@tmuxaxxing_slot},}" "run-shell -b \"bun \\\"$TMUXAXXING_ROOT/src/cli.ts\\\" seen #{pane_id}\""'

set-option -g status-interval 2
set-option -g status-right '#(bun "$TMUXAXXING_ROOT/src/cli.ts" status)'
set-option -g window-status-format '#I:#W#{?@tmuxaxxing_dot,●,}'
set-option -g window-status-current-format '#I:#W#{?@tmuxaxxing_dot,●,}'

bind-key -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},slk}' 'run-shell '"'"'"$TMUXAXXING_ROOT/scripts/slack-toggle.sh"'"'"'' 'select-window -t ='
